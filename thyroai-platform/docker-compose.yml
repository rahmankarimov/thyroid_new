# ThyroAI Platform — single stack for clinical + DICOM imaging pipeline.
# Usage: cp .env.example .env && docker compose up --build -d

name: thyroai-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: thyroai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Default DB created by the image; init script also creates thyroaidb + medical_imaging.
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - thyroai_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: thyroai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    volumes:
      - thyroai_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: thyroai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - thyroai_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: alpine:latest
    container_name: thyroai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl;
      curl -s -O https://dl.min.io/client/mc/release/linux-amd64/mc;
      chmod +x mc;
      ./mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      ./mc mb -p local/$${MINIO_BUCKET} || true;
      ./mc anonymous set none local/$${MINIO_BUCKET};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

  orthanc:
    build:
      context: ./services/orthanc
      dockerfile: Dockerfile
    container_name: thyroai-orthanc
    restart: unless-stopped
    ports:
      - "${ORTHANC_API_PORT}:8042"
      - "${ORTHANC_DICOM_PORT}:4242"
    volumes:
      - thyroai_orthanc_data:/var/lib/orthanc/db
    environment:
      ORTHANC_NAME: ${ORTHANC_NAME}
      ORTHANC_DICOM_AET: ${ORTHANC_DICOM_AET}
      ORTHANC_ADMIN_USER: ${ORTHANC_ADMIN_USER}
      ORTHANC_ADMIN_PASS: ${ORTHANC_ADMIN_PASS}
      ORTHANC_BASIC_USER: ${ORTHANC_BASIC_USER}
      ORTHANC_BASIC_PASS: ${ORTHANC_BASIC_PASS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      QUEUE_NAME: ${QUEUE_NAME}
    depends_on:
      rabbitmq:
        condition: service_healthy

  clinical-backend:
    build:
      context: ./services/clinical-backend
      dockerfile: Dockerfile
    container_name: thyroai-clinical-backend
    restart: unless-stopped
    ports:
      - "${CLINICAL_BACKEND_PORT}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/thyroaidb
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DICOM_INGEST_KEY: ${THYROAI_INGEST_KEY}
      DICOM_INGEST_ENABLED: ${THYROAI_INGEST_ENABLED}
    volumes:
      - thyroai_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  imaging-service:
    build:
      context: ./services/imaging-service
      dockerfile: Dockerfile
    container_name: thyroai-imaging-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      QUEUE_NAME: ${QUEUE_NAME}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medical_imaging
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC_BASE_URL: http://orthanc:8042
      ORTHANC_BASIC_USER: ${ORTHANC_BASIC_USER}
      ORTHANC_BASIC_PASS: ${ORTHANC_BASIC_PASS}
      THYROAI_BASE_URL: http://clinical-backend:8080
      THYROAI_INGEST_KEY: ${THYROAI_INGEST_KEY}
      THYROAI_INGEST_ENABLED: ${THYROAI_INGEST_ENABLED}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_REGION: ${S3_REGION}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      orthanc:
        condition: service_started
      clinical-backend:
        condition: service_healthy

  doctor-panel:
    build:
      context: ../doctor-panel
      dockerfile: Dockerfile
    container_name: thyroai-doctor-panel
    restart: unless-stopped
    ports:
      - "${DOCTOR_PANEL_PORT}:80"
    depends_on:
      clinical-backend:
        condition: service_healthy

  admin-panel:
    build:
      context: ./frontends/admin-panel
      dockerfile: Dockerfile
    container_name: thyroai-admin-panel
    restart: unless-stopped
    ports:
      - "${ADMIN_PANEL_PORT}:80"
    depends_on:
      clinical-backend:
        condition: service_healthy

  super-admin-panel:
    build:
      context: ./frontends/super-admin-panel
      dockerfile: Dockerfile
    container_name: thyroai-super-admin-panel
    restart: unless-stopped
    ports:
      - "${SUPER_ADMIN_PANEL_PORT}:80"
    depends_on:
      clinical-backend:
        condition: service_healthy

volumes:
  thyroai_postgres_data:
  thyroai_rabbitmq_data:
  thyroai_minio_data:
  thyroai_orthanc_data:
  thyroai_uploads:
