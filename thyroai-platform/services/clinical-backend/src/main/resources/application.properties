spring.application.name=thyroai-backend
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/thyroaidb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

thyroai.jwt.secret=${JWT_SECRET:dGh5cm9haS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNQ==}
thyroai.jwt.expiration=28800000
thyroai.jwt.refresh-expiration=604800000

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

thyroai.images.upload-dir=./uploads/images

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

thyroai.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

thyroai.dicom.ingest-key=${DICOM_INGEST_KEY:}
thyroai.dicom.ingest-enabled=${DICOM_INGEST_ENABLED:true}

thyroai.recaptcha.enabled=${RECAPTCHA_ENABLED:false}
thyroai.recaptcha.secret=${RECAPTCHA_SECRET:}

logging.level.com.thyroai=INFO
