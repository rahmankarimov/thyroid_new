# ThyroAI production stack (single VPS).
# Usage (from this folder):
#   cp .env.prod.example .env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only port 80 is exposed publicly. Postgres, MinIO and the backend
# are reachable only on the internal Docker network; nginx in the
# "web" container proxies /api, /images and /medical-imaging.

name: thyroai-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: thyroai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../thyroai-platform/infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: thyroai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # Console only on the server's loopback; reach it with an SSH tunnel:
    #   ssh -L 9001:localhost:9001 root@<server>
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  clinical-backend:
    build:
      context: ../thyroai-platform/services/clinical-backend
      dockerfile: Dockerfile
    container_name: thyroai-clinical-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/thyroaidb
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DICOM_INGEST_ENABLED: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  web:
    build:
      context: ../doctor-panel
      dockerfile: Dockerfile
    container_name: thyroai-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - clinical-backend
      - minio

volumes:
  postgres_data:
  minio_data:
  uploads:
