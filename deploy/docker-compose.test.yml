# ThyroAI Isolated Test Environment Stack (runs alongside thyroai-prod without touching port 80 or prod data).
# Publicly exposed on port 8081: http://157.173.121.121:8081

name: thyroai-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: thyroai-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thyroai_test_pass}
      POSTGRES_DB: postgres
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ../thyroai-platform/infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: thyroai-test-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    volumes:
      - minio_test_data:/data
    ports:
      - "127.0.0.1:9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  clinical-backend:
    build:
      context: ../thyroai-platform/services/clinical-backend
      dockerfile: Dockerfile
    container_name: thyroai-test-clinical-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/thyroaidb
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-thyroai_test_pass}
      JWT_SECRET: ${JWT_SECRET:-dGh5cm9haS1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tMjAyNQ==}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://157.173.121.121:8081,http://localhost:8081}
      DICOM_INGEST_ENABLED: "false"
    volumes:
      - uploads_test:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  web:
    build:
      context: ../doctor-panel
      dockerfile: Dockerfile
    container_name: thyroai-test-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - clinical-backend
      - minio

volumes:
  postgres_test_data:
  minio_test_data:
  uploads_test:
