server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Docker's internal DNS, so nginx starts even if a service is still booting
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend http://clinical-backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /images/ {
        set $backend http://clinical-backend:8080;
        proxy_pass $backend;
    }

    # Dataset images stored in MinIO (bucket: medical-imaging, read-only public)
    location /medical-imaging/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
